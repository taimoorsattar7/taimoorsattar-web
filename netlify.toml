[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  NETLIFY_NEXT_PLUGIN_SKIP = "false"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[redirects]]
  from = "https://taimoorsattar.dev/*"
  to = "https://taimoorsattar.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/books/workflow-to-build-static-website"
  to = "/p/build-standout-website"
  status = 301

[[redirects]]
  from = "/books/how-to-build-JAMstack-site"
  to = "/p/build-standout-website"
  status = 301

[[redirects]]
  from = "/blogs/monolithic-and-microservice-architecture-for-website-development"
  to = "/blogs/what-is-jamstack"
  status = 301

[[redirects]]
  from = "/my-work"
  to = "https://www.notion.so/taimoorsattar/Taimoor-Sattar-d5567816c47f4c91b875b76bdad3fcc8"
  status = 302